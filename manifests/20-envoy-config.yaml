# Envoy's entire configuration. Nothing here is generated by an operator - this
# is the file you own, and the reason a standalone Envoy Deployment is worth the
# extra object: you choose the version, the filters and the release cadence.
#
# The chain, in order, for one inbound request:
#
#   cors                  -> answer browser preflight, allow the kiosk's origin
#   grpc_web              -> unwrap gRPC-Web framing from a browser into gRPC
#   grpc_json_transcoder  -> turn REST+JSON into gRPC using the proto descriptor
#   router                -> forward to the inventory cluster over HTTP/2
#
# The backend speaks gRPC and only gRPC. Every modern interface below is added
# here, in front of it, without changing a line of the application.
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: modernize-demo
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }

    static_resources:
      listeners:
      - name: edge
        address:
          socket_address: { address: 0.0.0.0, port_value: 8080 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: edge
              codec_type: AUTO
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                  log_format:
                    json_format:
                      t: "%START_TIME%"
                      method: "%REQ(:METHOD)%"
                      path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                      proto: "%PROTOCOL%"
                      status: "%RESPONSE_CODE%"
                      grpc: "%GRPC_STATUS%"
                      dur_ms: "%DURATION%"
                      upstream: "%UPSTREAM_HOST%"
                      via: "%REQ(X-DEMO-INTERFACE)%"
              route_config:
                name: edge
                virtual_hosts:
                - name: all
                  domains: ["*"]
                  # The kiosk is served through this same Envoy, so it is already
                  # same-origin and needs no CORS. This is here so a kiosk hosted
                  # somewhere else still works. VirtualHost.cors is deprecated in
                  # favour of typed_per_filter_config as of Envoy 1.39.
                  typed_per_filter_config:
                    envoy.filters.http.cors:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                      allow_origin_string_match:
                      - safe_regex: { regex: ".*" }
                      allow_methods: "GET, POST, DELETE, OPTIONS"
                      allow_headers: "keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout"
                      expose_headers: "grpc-status,grpc-message"
                      max_age: "1728000"
                  routes:
                  # IMPORTANT: match the gRPC path, not the REST path.
                  # grpc_json_transcoder rewrites the request before the router
                  # selects a route: GET /v1/items becomes
                  #   POST /legacy.inventory.v1.Inventory/ListItems
                  # so a route matching "/v1/" never fires and the call falls
                  # through to whatever catch-all comes next.
                  - match: { prefix: "/legacy.inventory.v1.Inventory/" }
                    route:
                      cluster: inventory
                      timeout: 30s
                  # native gRPC and gRPC-Web clients arrive on this path already
                  - match: { prefix: "/v1/" }
                    route:
                      cluster: inventory
                      timeout: 30s
                  # anything else is the kiosk itself, so the page and the API
                  # share an origin and the browser needs no cross-origin dance
                  - match: { prefix: "/" }
                    route:
                      cluster: kiosk
                      timeout: 10s
              http_filters:
              - name: envoy.filters.http.cors
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
              - name: envoy.filters.http.grpc_web
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
              - name: envoy.filters.http.grpc_json_transcoder
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                  proto_descriptor: /etc/envoy/proto/inventory.pb
                  services: ["legacy.inventory.v1.Inventory"]
                  auto_mapping: false
                  convert_grpc_status: true
                  print_options:
                    add_whitespace: true
                    always_print_primitive_fields: true
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: kiosk
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        connect_timeout: 2s
        load_assignment:
          cluster_name: kiosk
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: kiosk, port_value: 8080 }

      - name: inventory
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        connect_timeout: 2s
        # STRICT_DNS re-resolves on a timer, so when every backend pod is
        # replaced at once there is a window where Envoy still holds the old
        # addresses and answers "no healthy upstream". Two seconds keeps that
        # window short; it recovers on its own either way.
        dns_refresh_rate: 2s
        respect_dns_ttl: false
        # The backend is gRPC, so the upstream MUST be HTTP/2. Leave this out and
        # Envoy speaks HTTP/1.1 upstream and every call fails.
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: inventory
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: inventory, port_value: 50051 }
